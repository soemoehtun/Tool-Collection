<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Collection | All your tools in one place</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#ffffff;--fg:#000000;--muted:#6b7280;--muted-light:#9ca3af;--muted-faint:#d1d5db;
--border:#e5e7eb;--card:#ffffff;--card-alt:#f3f4f6;--card-border:#e0e0e0;--accent:#6b7280;
--pullcord-ink:rgba(127,127,127,.45);
}
.dark{
--bg:#0d0d0d;--fg:#ffffff;--muted:rgba(255,255,255,.55);--muted-light:rgba(255,255,255,.45);
--muted-faint:rgba(255,255,255,.35);--border:rgba(255,255,255,.08);--card:#161616;
--card-alt:#111;--card-border:rgba(255,255,255,.08);--accent:#9ca3af;
--pullcord-ink:rgba(200,200,200,.45);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);transition:background .3s,color .3s;min-height:100vh}
.container{max-width:80rem;margin:0 auto;padding:3rem 1.5rem}
.header{margin-bottom:2.5rem}
.header h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem}
.header p{font-size:.9rem;color:var(--muted);max-width:42rem;line-height:1.6}
.toolbar{display:flex;flex-direction:column;gap:.75rem;margin-bottom:2rem}
@media(min-width:768px){.toolbar{flex-direction:row;align-items:center;justify-content:space-between}.header h1{font-size:3rem}.header p{font-size:1rem}}
.search-wrap{position:relative;width:100%;max-width:24rem}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted-light);pointer-events:none}
.search-input{display:block;width:100%;padding:.75rem .75rem .75rem 2.5rem;border:1px solid var(--border);border-radius:.75rem;background:var(--card);color:var(--fg);font-size:.9rem;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search-input::placeholder{color:var(--muted-faint)}
.search-input:focus{box-shadow:0 0 0 2px var(--accent)}
.filters{display:flex;flex-wrap:nowrap;gap:.25rem;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.filter-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted-light);font-size:.875rem;font-weight:500;padding:.25rem .25rem;margin:0 .25rem;cursor:pointer;white-space:nowrap}
.filter-btn:hover{color:var(--fg)}
.filter-btn.active{color:var(--fg);border-bottom-color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tool-card{background:var(--card);border:1px solid var(--card-border);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;height:100%;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s;animation:fadeIn .5s ease-out}
.tool-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card-preview{width:100%;height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.card-preview img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .3s}
.tool-card:hover .card-preview img{transform:scale(1.04)}
.card-preview .fallback{width:64px;height:64px;color:#fff}
.card-body{padding:16px 16px 20px}
.card-title-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.card-title{font-size:1rem;font-weight:500;color:var(--accent);line-height:1.3;flex:1;cursor:pointer}
.card-menu-btn{background:none;border:none;cursor:pointer;padding:2px 4px;color:var(--muted-light);flex-shrink:0;margin-left:8px}
.card-menu-btn:hover{color:var(--fg)}
.card-description{font-size:.84rem;color:var(--muted);line-height:1.5}
.readme-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:500}
.readme-link:hover{text-decoration:underline}
.empty{text-align:center;padding:5rem 0;animation:fadeIn .5s ease-out}
.empty .circle{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;background:var(--card-alt);margin-bottom:1rem}
.empty h3{font-size:1.25rem;font-weight:600;margin-bottom:.25rem}
.empty p{color:var(--muted)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#f1f1f1}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.dark ::-webkit-scrollbar-track{background:#1a1a1a}
.dark ::-webkit-scrollbar-thumb{background:#444}
/* theme button (always visible fallback) */
.theme-btn{position:fixed;top:14px;right:14px;z-index:200;background:var(--card);border:1px solid var(--card-border);color:var(--fg);border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.theme-btn:hover{transform:scale(1.05)}
/* pullcord */
.pullcord{position:fixed;top:0;right:7rem;z-index:100;width:64px;height:340px;pointer-events:none}
.pullcord-inner{position:absolute;inset:0}
.pullcord-inner--drop{animation:pullcord-drop .6s .4s cubic-bezier(.45,0,.9,.5) both}
@keyframes pullcord-drop{0%{opacity:0;transform:translateY(-230px)}20%{opacity:1}100%{transform:translateY(0)}}
.pullcord-knob{position:absolute;border:none;background:transparent;cursor:grab;touch-action:none;pointer-events:auto;-webkit-tap-highlight-color:transparent;border-radius:50%}
.pullcord-knob:active{cursor:grabbing}
@media(max-width:640px){.pullcord{right:4rem}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
<div class="pullcord" id="pullcord" title="Pull to toggle theme">
  <div class="pullcord-inner pullcord-inner--drop" id="pullcordInner">
    <svg viewBox="0 0 64 340" width="64" height="340" style="overflow:visible" aria-hidden="true">
      <defs>
        <linearGradient id="pc-knob" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e7e7ec"/>
        </linearGradient>
      </defs>
      <path id="cordPath" d="" stroke="var(--pullcord-ink)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <g id="knobGroup"><circle id="knobCircle" cx="32" cy="176" r="6.5" fill="url(#pc-knob)" stroke="rgba(0,0,0,.1)" stroke-width=".5"/></g>
    </svg>
    <button class="pullcord-knob" id="knobBtn" aria-label="Toggle theme" title="Pull to toggle theme"></button>
  </div>
</div>
<div class="container">
  <div class="header">
    <h1>Tool Collection</h1>
    <p>Hi, I’m Soe Moe Tun. I created these tools to simplify everyday telecom tasks and make things more efficient for the community.</p>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" class="search-input" placeholder="Search for tools...">
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="circle"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted-light)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
    <h3>No tools found</h3>
    <p>Try adjusting your search or filter to find what you're looking for.</p>
  </div>
</div>
<script>
(function(){
"use strict";
var toolsData=[
{id:1,name:"Point File Creator",description:"A web-based tool for creating point-based maps from CSV/Excel data and exporting to KML format.",category:"Map Tools",previewBg:"#2c3e50",thumbnail:"./Thumbnail/Point File Creator.png",url:"https://point-file-creator.vercel.app/",readme:"https://github.com/soemoehtun/Point-File-Creator/blob/main/README.md"},
{id:2,name:"Site to Site Distance Calculator",description:"Calculate the precise geodetic distance between two network sites.",category:"Map Tools",previewBg:"#1a3a5c",thumbnail:"./Thumbnail/Site To Site Distance.png",url:"https://site-2-site-distance-calculator.vercel.app/",readme:"https://github.com/soemoehtun/Site-2-Site-Distance-Calculator/blob/main/README.md"},
{id:3,name:"Cell Parameter KML Export Tool",description:"Convert site data into KML format for Google Earth visualization.",category:"Map Tools",previewBg:"#009688",thumbnail:"./Thumbnail/Cell File Creator.png",url:"https://engineering-parameter-kml-creators.vercel.app/",readme:"https://github.com/soemoehtun/Engineering-Parameter-KML-creator/blob/main/README.md"},
{id:4,name:"Sector to Site Distance Calculator",description:"Calculate the distance from a sector antenna to a target site with precision.",category:"Map Tools",previewBg:"#37474f",thumbnail:"./Thumbnail/Sector To Site Distance.png",url:"https://sector-to-site-distance-calculator.vercel.app/",readme:"https://github.com/soemoehtun/Sector-To-Site-Distance-Calculator/blob/master/README.md"},
{id:5,name:"Cell ID Calculator",description:"Encode and decode 2G/3G/4G/5G cell identifiers \u2014 CGI, ECGI, and NCI. Supports encode/decode modes with Decimal, Hex, and Binary output formats.",category:"Converter Tools",previewBg:"#0d1b2a",thumbnail:"./Thumbnail/Cell ID Calculator.png",url:"https://cell-id-calculator.vercel.app/",readme:"https://github.com/soemoehtun/cell-id-calculator/blob/main/README.md"},
{id:6,name:"Gold Calculator",description:"Calculate gold prices, purity, weight conversions, and value based on current market rates.",category:"Calculator Tools",previewBg:"#b8860b",thumbnail:"./Thumbnail/Gold Calculator.png",url:"https://gold-calculator-six-pi.vercel.app/",readme:"https://github.com/soemoehtun/Gold-Calculator/blob/main/README.md"},
{id:7,name:"Row To Column Converter",description:"Convert rows to columns or columns to rows instantly. Upload CSV, Excel, or text files, transform your data with one click, and export accurate results in seconds.",category:"Excel Tools",previewBg:"#2563eb",thumbnail:"./Thumbnail/rowtocolumn.png",url:"https://rowtocolumn.vercel.app/",readme:"https://github.com/soemoehtun/rowtocolumnconverter/blob/main/README.md"},
{id:8,name:"Combine & Split File",description:"Import, validate, combine, and split Excel, CSV, or TXT files with flexible options. Supports drag & drop, sheet selection, start row settings, delimiter selection, header mismatch detection, and splitting by row count, file count, or maximum file size.",category:"Excel Tools",previewBg:"#0d9488",thumbnail:"./Thumbnail/Combine File.png",url:"https://combine-file.vercel.app/",readme:"https://github.com/soemoehtun/Combine-File/blob/main/README.md"},
{id:9,name:"Antenna Tilt & Coverage",description:"Visualize antenna tilt angles and coverage patterns on an interactive map for telecom network planning and optimization.",category:"Map Tools",previewBg:"#00695c",thumbnail:"./Thumbnail/Tilt and coverage.png",url:"https://antenna-tilt-coverage-visualization.vercel.app/",readme:"https://github.com/soemoehtun/Antenna-Tilt-Coverage-Visualization/blob/master/README.md"},
{id:10,name:"Cluster Polygon Generator",description:"A browser-based GIS tool for finding neighbour sites around each source, calculating site-to-site distances, drawing convex-hull polygons, and exporting CSV and KMZ files.",category:"Map Tools",previewBg:"#00695c",thumbnail:"./Thumbnail/Source and Neighbor Polygon.png",url:"https://source-and-neighbor-polygon-generat.vercel.app/",readme:"https://github.com/soemoehtun/Source-and-Neighbor-Polygon-Generator/blob/main/README.md"},
{id:11,name:"dBm to watts Conversion Calculator",description:"Convert power between Watts (W), milliwatts (mW), dBm, and dBW.",category:"Converter Tools",previewBg:"#00695c",thumbnail:"./Thumbnail/rfpower.png",url:"https://rf-power.vercel.app/",readme:"https://github.com/soemoehtun/RF-Power/blob/main/README.md"}
];
var categories=["All","Excel Tools","Map Tools","Converter Tools","Calculator Tools"];
var searchTerm="",activeCategory="All";
var grid=document.getElementById("grid"),emptyEl=document.getElementById("empty"),
    filtersEl=document.getElementById("filters"),searchEl=document.getElementById("search");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fallbackIcon(){return '<svg class="fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';}
function renderFilters(){
  filtersEl.innerHTML="";
  categories.forEach(function(c){
    var b=document.createElement("button");
    b.className="filter-btn"+(c===activeCategory?" active":"");
    b.textContent=c;
    b.onclick=function(){activeCategory=c;renderFilters();render();};
    filtersEl.appendChild(b);
  });
}
function render(){
  var q=searchTerm.toLowerCase();
  var list=toolsData.filter(function(t){
    var okCat=(activeCategory==="All"||t.category===activeCategory);
    var okQ=!q||t.name.toLowerCase().indexOf(q)>-1||t.description.toLowerCase().indexOf(q)>-1;
    return okCat&&okQ;
  });
  grid.innerHTML="";
  emptyEl.style.display=list.length?"none":"block";
  list.forEach(function(tool){
    var card=document.createElement("div");
    card.className="tool-card";
    var readmeHtml=tool.readme?'<a class="readme-link" href="'+esc(tool.readme)+'" target="_blank" rel="noopener noreferrer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>README</a>':"";
    card.innerHTML='<div class="card-preview" style="background:'+esc(tool.previewBg)+'"><img alt="'+esc(tool.name)+'" src="'+esc(tool.thumbnail)+'"></div>'+
    '<div class="card-body"><div class="card-title-row"><span class="card-title">'+esc(tool.name)+'</span>'+
    '<button class="card-menu-btn" title="More options"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div>'+
    '<p class="card-description">'+esc(tool.description)+'</p>'+readmeHtml+'</div>';
    var img=card.querySelector("img");
    img.onerror=function(){var p=card.querySelector(".card-preview");p.innerHTML=fallbackIcon();};
    if(img.complete&&img.naturalWidth===0){var pp=card.querySelector(".card-preview");pp.innerHTML=fallbackIcon();}
    var preview=card.querySelector(".card-preview");
    preview.onclick=function(){if(tool.url&&tool.url!=="#"){window.open(tool.url,"_blank");}};
    card.querySelector(".card-title").onclick=function(){if(tool.url&&tool.url!=="#"){window.open(tool.url,"_blank");}};
    grid.appendChild(card);
  });
}
searchEl.addEventListener("input",function(e){searchTerm=e.target.value;render();});
/* theme */
function setDark(d){document.documentElement.classList.toggle("dark",d);try{localStorage.setItem("theme",d?"dark":"light");}catch(e){}document.getElementById("themeBtn").textContent=d?"◐":"◑";}
var initDark=true;
try{var s=localStorage.getItem("theme");initDark=s!==null?s==="dark":true;}catch(e){}
setDark(initDark);
function toggleTheme(){setDark(!document.documentElement.classList.contains("dark"));}
document.getElementById("themeBtn").onclick=toggleTheme;
/* pullcord physics (vanilla port, click/drag pulls toggle) */
try{
var W=64,AX=32,REST_Y=176,SVG_H=340,SEG=16,REST_SEG=REST_Y/SEG;
function mkNodes(){var a=[];for(var i=0;i<=SEG;i++){var y=REST_SEG*i;a.push({x:AX,y:y,ox:AX,oy:y,fixed:i===0});}return a;}
function buildPath(p){var d="M "+p[0].x.toFixed(1)+" "+p[0].y.toFixed(1);for(var i=1;i<p.length-1;i++){var xc=(p[i].x+p[i+1].x)/2,yc=(p[i].y+p[i+1].y)/2;d+=" Q "+p[i].x.toFixed(1)+" "+p[i].y.toFixed(1)+" "+xc.toFixed(1)+" "+yc.toFixed(1);}d+=" L "+p[p.length-1].x.toFixed(1)+" "+p[p.length-1].y.toFixed(1);return d;}
var pts=mkNodes(),cord=document.getElementById("cordPath"),kg=document.getElementById("knobGroup"),kb=document.getElementById("knobBtn"),inner=document.getElementById("pullcordInner");
var HIT=46;kb.style.left=(AX-HIT/2)+"px";kb.style.top=(REST_Y-HIT/2)+"px";kb.style.width=HIT+"px";kb.style.height=HIT+"px";
function draw(){cord.setAttribute("d",buildPath(pts));var l=pts[pts.length-1];kg.setAttribute("transform","translate("+(l.x-AX).toFixed(2)+" "+(l.y-REST_Y).toFixed(2)+")");}
draw();
var dragging=false,didDrag=false,clicked=false,target={x:AX,y:REST_Y},raf=0,sx=0,sy=0;
var gravity=1250,damping=.94,iters=20;
function step(now){step.t=step.t||0;var dt=step.t?Math.min(.04,Math.max(.004,(now-step.t)/1000)):1/60;step.t=now;var last=pts.length-1;pts[last].fixed=dragging;
for(var i=1;i<pts.length;i++){var p=pts[i];if(p.fixed)continue;var vx=p.x-p.ox,vy=p.y-p.oy;p.ox=p.x;p.oy=p.y;p.x+=vx*Math.pow(damping,dt*60);p.y+=vy*Math.pow(damping,dt*60)+gravity*dt*dt;}
pts[0].x=AX;pts[0].y=0;
if(dragging){pts[last].ox=pts[last].x;pts[last].oy=pts[last].y;pts[last].x=target.x;pts[last].y=target.y;}
for(var k=0;k<iters;k++){for(var j=0;j<last;j++){var a=pts[j],b=pts[j+1],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.0001,diff=((REST_SEG-dist)/dist)*.5,ox=dx*diff,oy=dy*diff;if(!a.fixed){a.x-=ox;a.y-=oy;}if(!b.fixed){b.x+=ox;b.y+=oy;}}}
draw();
var sp=0;for(var s2=1;s2<pts.length;s2++)sp+=Math.abs(pts[s2].x-pts[s2].ox)+Math.abs(pts[s2].y-pts[s2].oy);
if(!dragging&&sp<.15*dt*60){draw();raf=0;step.t=0;return;}
raf=requestAnimationFrame(step);}
function wake(){if(raf)cancelAnimationFrame(raf);step.t=0;raf=requestAnimationFrame(step);}
function scripted(){toggleTheme();var l=pts[pts.length-1];l.oy-=22;wake();}
kb.addEventListener("pointerdown",function(e){try{kb.setPointerCapture(e.pointerId);}catch(_){}dragging=true;didDrag=true;clicked=false;var r=inner.getBoundingClientRect();sx=e.clientX-r.left-AX;sy=e.clientY-r.top-REST_Y;wake();});
kb.addEventListener("pointermove",function(e){if(!dragging)return;var r=inner.getBoundingClientRect();var rx=e.clientX-r.left-AX-sx,ry=e.clientY-r.top-REST_Y-sy;var dist=Math.hypot(rx,ry)||.0001,maxD=REST_Y+26,k=dist>maxD?maxD/dist:1;target={x:AX+rx*k,y:REST_Y+ry*k};if(!clicked&&dist>=20){clicked=true;toggleTheme();}});
kb.addEventListener("pointerup",function(e){try{kb.releasePointerCapture(e.pointerId);}catch(_){}dragging=false;wake();setTimeout(function(){didDrag=false;},0);});
kb.addEventListener("click",function(e){if(didDrag)return;if(e.detail===0)return;scripted();});
kb.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&!e.repeat){e.preventDefault();scripted();}});
inner.addEventListener("animationend",function(e){if(e.animationName!=="pullcord-drop")return;inner.classList.remove("pullcord-inner--drop");var l=pts[pts.length-1];l.oy-=13;l.ox-=6;wake();});
setTimeout(function(){if(inner.classList.contains("pullcord-inner--drop")){inner.classList.remove("pullcord-inner--drop");}},1700);
}catch(err){}
renderFilters();render();
})();
</script>
</body>
</html>
