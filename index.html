    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --muted: #6b7280;
            --muted-light: #9ca3af;
            --muted-faint: #d1d5db;
            --border: #e5e7eb;
            --border-medium: #d1d5db;
            --card: #ffffff;
            --card-alt: #f3f4f6;
            --card-border: #e0e0e0;
            --accent: #6b7280;
        }
        .dark {
            --bg: #0d0d0d;
            --fg: #ffffff;
            --muted: rgba(255,255,255,0.55);
            --muted-light: rgba(255,255,255,0.45);
            --muted-faint: rgba(255,255,255,0.35);
            --border: rgba(255,255,255,0.08);
            --border-medium: rgba(255,255,255,0.12);
            --card: #161616;
            --card-alt: #111;
            --card-border: rgba(255,255,255,0.08);
            --accent: #9ca3af;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: background 0.3s, color 0.3s;
        }

        .tool-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border-radius: 4px;
            overflow: hidden;

        }

        }

            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.4);
        }

            height: 220px;
            display: flex;

            justify-content: center;
            position: relative;
            overflow: hidden;
        }

            height: 100%;

            object-position: top;
            display: block;
            transition: transform 0.3s ease;
        }

        .tool-card:hover .card-preview-thumb {

        }

        .card-preview-icon {
            width: 64px;
            height: 64px;
            opacity: 0.9;
        }

        .card-body {
            padding: 16px 16px 20px 16px;
        }

        .card-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent);
            line-height: 1.3;
            flex: 1;
        }

        .card-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            color: var(--muted-light);
            flex-shrink: 0;
            margin-left: 8px;
            margin-top: -2px;
            transition: color 0.15s;
        }

        .card-menu-btn:hover {
            color: var(--fg);
        }

        .card-description {
            font-size: 0.84rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hide scrollbar for category filter */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #444;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            padding: 6px;
            display: inline-flex;
            align-items: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
        }
        .theme-toggle:hover {
            color: var(--accent);
            background: rgba(128,128,128,0.1);
        }
        .search-input::placeholder {
            color: var(--muted-faint);
        }
        .search-input:focus {

        }

        :root {
            --pullcord-top: 0px;
            --pullcord-right: 7rem;
            --pullcord-z: 5;
            --pullcord-ink: rgba(127, 127, 127, 0.45);
        }
        .dark {
            --pullcord-ink: rgba(200, 200, 200, 0.45);
        }
        .pullcord-wrap {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
        }
        .pullcord-wrap .pullcord {
            right: 0 !important;
        }
        .pullcord-inner {
            position: absolute;
            inset: 0;
        }
        .pullcord-inner--drop {
            animation: pullcord-drop 0.6s 0.4s cubic-bezier(0.45, 0, 0.9, 0.5) both;
        }
        @keyframes pullcord-drop {
            0% { opacity: 0; transform: translateY(-230px); }
            20% { opacity: 1; }
            100% { transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .pullcord-inner--drop { animation: none; }
        }
        .pullcord-knob {
            -webkit-tap-highlight-color: transparent;
            border-radius: 50%;
        }
        .pullcord-knob:active { cursor: grabbing; }
        .pullcord-knob:focus-visible {
            outline: 2px solid var(--pullcord-ink, rgba(127,127,127,0.6));
            outline-offset: -9px;
        }
    </style>

                            >

        };

        function PullCord({ onPull, pulled = false, ariaLabel = 'Toggle theme', noEntrance = false }) {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const W = 64, ANCHOR_X = 32, REST_Y = 176, SVG_H = 340, SEGMENTS = 16, REST_SEG = REST_Y / SEGMENTS, KNOB_R = 6.5, HIT = 46;

            function buildPath(p) {
                let d = `M ${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
                for (let i = 1; i < p.length - 1; i++) {
                    const xc = (p[i].x + p[i + 1].x) / 2;
                    const yc = (p[i].y + p[i + 1].y) / 2;
                    d += ` Q ${p[i].x.toFixed(1)} ${p[i].y.toFixed(1)} ${xc.toFixed(1)} ${yc.toFixed(1)}`;
                }
                d += ` L ${p[p.length - 1].x.toFixed(1)} ${p[p.length - 1].y.toFixed(1)}`;
                return d;
            }

            function makeNodes() {
                const arr = [];
                for (let i = 0; i <= SEGMENTS; i++) {
                    const y = REST_SEG * i;
                    arr.push({ x: ANCHOR_X, y, ox: ANCHOR_X, oy: y, fixed: i === 0 });
                }
                return arr;
            }

            const gravity = 1250, damping = 0.94, iterations = 20, stretchMax = 26, stretchToggle = 20, maxVelocity = 22, sleepVelocity = 0.15;
            const INITIAL_PATH = buildPath(makeNodes());

            const knobRef = useRef(null), cordRef = useRef(null), groupRef = useRef(null), wrapperRef = useRef(null);
            const dragging = useRef(false), didDrag = useRef(false), clicked = useRef(false);
            const target = useRef({ x: ANCHOR_X, y: REST_Y }), wake = useRef(() => {});
            const onPullRef = useRef(onPull);
            onPullRef.current = onPull;
            const nodesRef = useRef(null);
            if (nodesRef.current === null) nodesRef.current = makeNodes();
            const startPointer = useRef({ x: 0, y: 0 });

            const [drop, setDrop] = useState(!noEntrance);
            const dropDone = useRef(noEntrance);

            useEffect(() => {
                const pts = nodesRef.current, last = pts.length - 1;
                let raf = 0, running = false, prevT = 0, prevDt = 0;

                const render = () => {
                    if (cordRef.current) cordRef.current.setAttribute('d', buildPath(pts));
                    if (groupRef.current) groupRef.current.setAttribute('transform', `translate(${(pts[last].x - ANCHOR_X).toFixed(2)} ${(pts[last].y - REST_Y).toFixed(2)})`);
                };

                const step = (now) => {
                    const dt = prevT ? Math.min(0.04, Math.max(0.004, (now - prevT) / 1000)) : 1 / 60;
                    prevT = now;
                    const tc = prevDt > 0 ? dt / prevDt : 1;
                    const velCoef = tc * Math.pow(damping, dt * 60);
                    const accCoef = dt * dt;

                    pts[last].fixed = dragging.current;
                    for (let i = 1; i < pts.length; i++) {
                        const p = pts[i]; if (p.fixed) continue;
                        const vx = p.x - p.ox, vy = p.y - p.oy;
                        p.ox = p.x; p.oy = p.y;
                        p.x += vx * velCoef; p.y += vy * velCoef + gravity * accCoef;
                    }
                    pts[0].x = ANCHOR_X; pts[0].y = 0;
                    if (dragging.current) {
                        pts[last].ox = pts[last].x; pts[last].oy = pts[last].y;
                        pts[last].x = target.current.x; pts[last].y = target.current.y;
                    }
                    for (let k = 0; k < iterations; k++) {
                        for (let i = 0; i < last; i++) {
                            const a = pts[i], b = pts[i + 1];
                            const dx = b.x - a.x, dy = b.y - a.y;
                            const dist = Math.hypot(dx, dy) || 0.0001;
                            const diff = ((REST_SEG - dist) / dist) * 0.5;
                            const ox = dx * diff, oy = dy * diff;
                            if (!a.fixed) { a.x -= ox; a.y -= oy; }
                            if (!b.fixed) { b.x += ox; b.y += oy; }
                        }
                    }
                    prevDt = dt; render();
                    let speed = 0;
                    for (let i = 1; i < pts.length; i++) speed += Math.abs(pts[i].x - pts[i].ox) + Math.abs(pts[i].y - pts[i].oy);
                    if (!dragging.current && speed < sleepVelocity * dt * 60) {
                        render(); running = false; return;
                    }
                    raf = requestAnimationFrame(step);
                };

                const start = () => {
                    if (raf) cancelAnimationFrame(raf);
                    running = true; prevT = 0; prevDt = 0;
                    raf = requestAnimationFrame(step);
                };

                wake.current = start;
                render();
                return () => { running = false; cancelAnimationFrame(raf); };
            }, []);

            const doToggle = () => onPullRef.current?.();

            const scriptedPull = () => {
                doToggle();
                if (reduce || !nodesRef.current) return;
                const pts = nodesRef.current;
                pts[pts.length - 1].oy -= 22;
                wake.current();
            };

            const onPointerDown = (e) => {
                if (!wrapperRef.current) return;
                e.currentTarget.setPointerCapture(e.pointerId);
                dragging.current = true; didDrag.current = true; clicked.current = false;
                const rect = wrapperRef.current.getBoundingClientRect();
                startPointer.current = { x: e.clientX - rect.left - ANCHOR_X, y: e.clientY - rect.top - REST_Y };
                wake.current();
            };

            const onPointerMove = (e) => {
                if (!dragging.current || !wrapperRef.current) return;
                const rect = wrapperRef.current.getBoundingClientRect();
                const rx = e.clientX - rect.left - ANCHOR_X - startPointer.current.x;
                const ry = e.clientY - rect.top - REST_Y - startPointer.current.y;
                const dist = Math.hypot(rx, ry) || 0.0001;
                const maxD = REST_Y + stretchMax;
                const k = dist > maxD ? maxD / dist : 1;
                target.current = { x: ANCHOR_X + rx * k, y: REST_Y + ry * k };
                const clickAt = Math.min(stretchToggle, stretchMax - 1);
                if (!clicked.current && dist >= clickAt) {
                    clicked.current = true;
                    doToggle();
                }
            };

            const onPointerUp = (e) => {
                if (!nodesRef.current) return;
                try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
                dragging.current = false;
                const pts = nodesRef.current, p = pts[pts.length - 1];
                const vx = p.x - p.ox, vy = p.y - p.oy, v = Math.hypot(vx, vy);
                if (v > maxVelocity) { const k = maxVelocity / v; p.ox = p.x - vx * k; p.oy = p.y - vy * k; }
                wake.current();
                requestAnimationFrame(() => { didDrag.current = false; });
            };

            const onClick = (e) => { if (didDrag.current) return; if (e.detail === 0) return; scriptedPull(); };
            const onKeyDown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); scriptedPull(); } };

            const endDrop = useCallback(() => {
                if (dropDone.current) return;
                dropDone.current = true; setDrop(false);
                if (reduce) return;
                const pts = nodesRef.current; if (!pts) return;
                pts[pts.length - 1].oy -= 13; pts[pts.length - 1].ox -= 6;
                wake.current();
            }, [reduce]);

            useEffect(() => {
                if (noEntrance) return;
                const fb = setTimeout(endDrop, 1700);
                return () => clearTimeout(fb);
            }, [endDrop, noEntrance]);

            const onDropEnd = (e) => { if (e.animationName !== 'pullcord-drop') return; endDrop(); };

            return (
                <div className="pullcord" style={{position:'fixed',top:'var(--pullcord-top,0px)',right:'var(--pullcord-right,7rem)',zIndex:'var(--pullcord-z,5)',width:W,height:SVG_H,pointerEvents:'none'}}>
                    <div ref={wrapperRef} className={drop ? 'pullcord-inner pullcord-inner--drop' : 'pullcord-inner'} onAnimationEnd={onDropEnd}>
                        <svg viewBox={`0 0 ${W} ${SVG_H}`} width={W} height={SVG_H} aria-hidden="true" style={{overflow:'visible'}}>
                            <defs>
                                <linearGradient id="pc-knob" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#ffffff" /><stop offset="100%" stopColor="#e7e7ec" />
                                </linearGradient>
                                <filter id="pc-knob-sh" x="-70%" y="-70%" width="240%" height="240%">
                                    <feDropShadow dx="0" dy="1.4" stdDeviation="1.5" floodColor="rgba(0,0,0,0.32)" />
                                </filter>
                            </defs>
                            <path ref={cordRef} d={INITIAL_PATH} stroke="var(--pullcord-ink,rgba(127,127,127,0.45))" strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round" fill="none" vectorEffect="non-scaling-stroke" />
                            <g ref={groupRef}>
                                <g filter="url(#pc-knob-sh)">
                                    <circle cx={ANCHOR_X} cy={REST_Y} r={KNOB_R} fill="url(#pc-knob)" stroke="rgba(0,0,0,0.10)" strokeWidth={0.5} />
                                </g>
                            </g>
                        </svg>
                        <button ref={knobRef} type="button" className="pullcord-knob" aria-label={ariaLabel} aria-pressed={pulled} title={ariaLabel}
                            onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp}
                            onClick={onClick} onKeyDown={onKeyDown}
                            style={{position:'absolute',left:ANCHOR_X-HIT/2,top:REST_Y-HIT/2,width:HIT,height:HIT,padding:0,border:'none',background:'transparent',cursor:'grab',touchAction:'none',pointerEvents:'auto'}} />
                    </div>
                </div>
            );
        }

        const App = () => {
            const [searchTerm, setSearchTerm] = useState("");
            const [activeCategory, setActiveCategory] = useState("All");
            const [dark, setDark] = useState(() => {
                const saved = localStorage.getItem('theme');
                return saved !== null ? saved === 'dark' : true;
            });

            useEffect(() => {
                document.documentElement.classList.toggle('dark', dark);
                localStorage.setItem('theme', dark ? 'dark' : 'light');
            }, [dark]);

            const filteredTools = useMemo(() => {
                return toolsData.filter(tool => {
                    const matchesCategory = activeCategory === "All" || tool.category === activeCategory;
                    const matchesSearch = tool.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        tool.description.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [searchTerm, activeCategory]);

            return (
                <>
                    <div className="pullcord-wrap">
                        <PullCord onPull={() => setDark(d => !d)} pulled={dark} />
                    </div>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                    {/* Header Section */}
                    <div className="flex flex-col mb-8 md:mb-12">
                            <h1 className="text-2xl md:text-5xl font-extrabold tracking-tight mb-2 md:mb-4">
                                Tool Collection
                            </h1>
                            <p className="text-xs md:text-base max-w-2xl" style={{color: 'var(--muted)'}}>
                                Hi, I’m Soe Moe Tun. I created these tools to simplify everyday telecom tasks and make things more efficient for the community.
                            </p>
                    </div>

                    {/* Search & Filter Section */}
                    <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 md:gap-6 mb-8 md:mb-12">
                        {/* Search Bar */}
                        <div className="relative w-full md:w-96 group">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <Icon name="Search" className="h-5 w-5 transition-colors" style={{color: 'var(--muted-light)'}} />
                            </div>
                            <input
                                type="text"
                                className="search-input block w-full pl-10 pr-3 py-3 border rounded-xl leading-5 focus:outline-none focus:ring-2 focus:border-transparent sm:text-sm transition-all shadow-sm"
                                style={{ background: 'var(--card)', color: 'var(--fg)', borderColor: 'var(--border)' }}
                                placeholder="Search for tools..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>

                        {/* Category Filter */}
                        <div className="flex flex-nowrap justify-start md:justify-end gap-1 md:gap-2 overflow-x-auto w-full no-scrollbar pb-1">
                            {categories.map(category => (
                                <button
                                    key={category}
                                    onClick={() => setActiveCategory(category)}
                                    className={`text-sm font-medium transition-all whitespace-nowrap flex-shrink-0 px-1 py-1 border-b-2 ${activeCategory === category
                                        ? "border-b-2"
                                        : "border-transparent"
                                        }`}
                                    style={{
                                        color: activeCategory === category ? 'var(--fg)' : 'var(--muted-light)',
                                        borderColor: activeCategory === category ? 'var(--fg)' : 'transparent'
                                    }}
                                    onMouseOver={e => { if (activeCategory !== category) e.currentTarget.style.color = 'var(--fg)'; }}
                                    onMouseOut={e => { if (activeCategory !== category) e.currentTarget.style.color = 'var(--muted-light)'; }}
                                >
                                    {category}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Tools Grid */}
                    {filteredTools.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredTools.map(tool => (
                                <ToolCard key={tool.id} tool={tool} />
                            ))}
                        </div>
                    ) : (
                        <div className="text-center py-20 fade-in">
                            <div className="inline-flex items-center justify-center w-20 h-20 rounded-full mb-4" style={{background: 'var(--card-alt)'}}>
                                <Icon name="Search" className="w-10 h-10" style={{color: 'var(--muted-light)'}} />
                            </div>
                            <h3 className="text-xl font-semibold mb-1" style={{color: 'var(--fg)'}}>No tools found</h3>
                            <p style={{color: 'var(--muted)'}}>Try adjusting your search or filter to find what you're looking for.</p>
                        </div>
                    )}


                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
